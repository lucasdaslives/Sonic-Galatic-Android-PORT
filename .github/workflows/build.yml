name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q projeto-s2m-android.zip -d proj

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK + CMake
        run: |
          SDKM=$(find "$ANDROID_HOME" /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)
          echo "sdkmanager em: $SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;24.0.8215888" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"

      - name: Get RSDKv5 engine
        run: |
          git clone --recursive https://github.com/RSDKModding/RSDKv5-Decompilation rsdk
          cd rsdk && git checkout 191d7aea6c262d891244172a8609ac69fbfd7571 && git submodule update --init --recursive

      - name: Get libogg + libtheora
        run: |
          cd rsdk/dependencies/android
          mkdir -p libogg libtheora
          curl -sL https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.gz | tar xz -C libogg --strip-components=1
          curl -sL https://downloads.xiph.org/releases/theora/libtheora-1.1.1.tar.gz | tar xz -C libtheora --strip-components=1

      - name: Link game logic
        run: |
          cd rsdk/android/app/jni
          ln -s "$GITHUB_WORKSPACE/proj/s2m" Game
          ln -s "$GITHUB_WORKSPACE/rsdk" RSDKv5

      - name: Build APK
        run: |
          cd rsdk/android
          chmod +x gradlew
          ./gradlew assembleRelease -PABIFILTERS="arm64-v8a" --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Sonic2Mania-APK
          path: rsdk/android/app/build/outputs/apk/release/*.apk
